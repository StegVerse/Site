name: Conectrr Live Verification

on:
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'
  workflow_run:
    workflows:
      - Site Task Runner
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: conectrr-live-verification-main
  cancel-in-progress: false

jobs:
  verify-conectrr-publication:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Site
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify deployed Conectrr assets
        run: |
          for attempt in $(seq 1 12); do
            if python scripts/check_conectrr_live_routes.py; then
              exit 0
            fi
            echo "Conectrr deployed publication verification attempt ${attempt}/12 did not pass; waiting for Pages propagation."
            sleep 10
          done
          exit 1

      - name: Install remote-browser verifier
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Execute deployed Conectrr runtime in Chromium
        env:
          STEGVERSE_PAGES_BASE_URL: https://stegverse-labs.github.io/Site
        run: |
          for attempt in $(seq 1 12); do
            if python scripts/check_conectrr_remote_browser.py; then
              exit 0
            fi
            echo "Conectrr remote-browser verification attempt ${attempt}/12 did not pass; waiting for deployed runtime propagation."
            sleep 10
          done
          exit 1

      - name: Persist finite live-verification state
        if: always()
        run: python scripts/update_conectrr_live_status.py || true

      - name: Upload Conectrr live verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conectrr-live-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/conectrr-live-verification.json
            reports/conectrr-remote-browser-verification.json
            data/conectrr-live-status.json
          if-no-files-found: error
          retention-days: 30

      - name: Write verification summary
        if: always()
        run: |
          echo "## Conectrr Live Verification" >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/conectrr-live-status.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          status = json.loads(Path('data/conectrr-live-status.json').read_text())
          print(f"State: {status.get('state')}")
          print(f"Public assets present: {status.get('deployed_publication_passed')}")
          print(f"Remote browser execution observed: {status.get('remote_browser_execution_passed')}")
          print(f"Authority effect: {status.get('authority_effect')}")
          print(f"Next executable action: {status.get('next_executable_action')}")
          PY
          fi
          echo "Boundary: browser fixture execution proves deployed runtime behavior only; it does not create live external interoperability, custody, admissibility, certification, or authority." >> "$GITHUB_STEP_SUMMARY"
