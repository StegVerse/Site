name: Site Task Runner

# GitHub-hosted execution is retained only as an optional validation fallback.
# Canonical continuation, generated-state mutation, ingestion, live observation,
# activation, and runtime work belong to StegVerse resident workers.
on:
  workflow_dispatch:
    inputs:
      task:
        description: Optional credential-free Site validation task
        required: true
        default: validate
        type: choice
        options:
          - validate
          - test-readiness
          - mirror-readiness
          - public-guard
          - task-elimination-guard

permissions: {}

concurrency:
  group: site-validation-fallback-${{ github.ref }}-${{ inputs.task }}
  cancel-in-progress: true

jobs:
  validate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refuse credential-bearing environment
        shell: bash
        run: |
          set -euo pipefail
          for name in GITHUB_TOKEN GH_TOKEN GITHUB_PAT TVC_EPHEMERAL_GITHUB_TOKEN STEGVERSE_REPO_SYNC_TOKEN STEGVERSE_PROVIDER_TOKEN STEGVERSE_MASTER_RECORDS_TOKEN STEGVERSE_HIL_REVIEW_TOKEN STEGVERSE_HIL_PUBLICATION_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            if [ -n "${!name:-}" ]; then
              echo "forbidden credential environment variable present: ${name}" >&2
              exit 1
            fi
          done
          echo 'SITE_TASK_RUNNER_ROLE=OPTIONAL_VALIDATION_FALLBACK_ONLY'
          echo 'SITE_TASK_RUNNER_PRODUCTION_CONTINUITY_DEPENDENCY=false'
          echo 'SITE_TASK_RUNNER_RUNTIME_AUTHORITY=NONE'
          echo 'SITE_TASK_RUNNER_MUTATION_AUTHORITY=NONE'
          echo 'SITE_TASK_RUNNER_CREDENTIAL_AUTHORITY=NONE'

      - name: Fetch exact Site source anonymously
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= -c http.extraheader= fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test -z "$(git config --local --get-regexp 'extraheader|credential' || true)"

      - name: Verify preinstalled Python and no public package bootstrap
        shell: bash
        run: |
          python3 --version
          python3 - <<'PY'
          import sys
          assert sys.version_info >= (3, 11), sys.version
          print('SITE_TASK_RUNNER_PYTHON=PREINSTALLED')
          print('SITE_TASK_RUNNER_PUBLIC_PACKAGE_INSTALL=false')
          PY

      - name: Enforce validation-only task class
        shell: bash
        env:
          REQUESTED_TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          case "$REQUESTED_TASK" in
            validate|test-readiness|mirror-readiness|public-guard|task-elimination-guard) ;;
            *)
              echo "task is not permitted on GitHub-hosted validation fallback: $REQUESTED_TASK" >&2
              exit 1
              ;;
          esac

      - name: Run declared validation task
        shell: bash
        env:
          REQUESTED_TASK: ${{ inputs.task }}
        run: python3 scripts/run_site_task.py "$REQUESTED_TASK"

      - name: Confirm no hosted orchestration or mutation role
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/site-task-runner.yml').read_text(encoding='utf-8')
          forbidden = (
              'workflow_' + 'run:',
              'permissions:\n  contents: write',
              'secrets' + '.',
              'actions/' + 'checkout@',
              'actions/' + 'setup-python@',
              'actions/' + 'upload-artifact@',
              'persist-' + 'credentials: true',
              'pip ' + 'install',
              'python -m ' + 'pip',
              'git ' + 'push',
              'STEGVERSE_REPO_SYNC_TOKEN' + ':',
              'onrender' + '.com',
              'vercel' + '.app',
              'netlify' + '.app',
              'acquire_' + 'governed_transition_index.py',
              'acquire_' + 'external_framework_catalog.py',
              'build_' + 'external_chat_activation_evidence.py',
          )
          assert 'permissions: {}' in workflow
          assert 'workflow_dispatch:' in workflow
          assert 'OPTIONAL_VALIDATION_FALLBACK_ONLY' in workflow
          assert 'PRODUCTION_CONTINUITY_DEPENDENCY=false' in workflow
          assert all(marker not in workflow for marker in forbidden), forbidden
          print('SITE_TASK_RUNNER_HOSTED_ORCHESTRATION=RETIRED')
          print('SITE_TASK_RUNNER_GITHUB_ACTIONS_ROLE=OPTIONAL_VALIDATION_FALLBACK_ONLY')
          print('SITE_TASK_RUNNER_PRODUCTION_CONTINUITY_DEPENDENCY=false')
          print('SITE_TASK_RUNNER_ACTIVATION_EFFECT=NONE')
          PY
