name: Site Bootstrap Validate - No Non-TV/TVC Credential Authority

on:
  workflow_dispatch:
  push:
  pull_request:

permissions: {}

concurrency:
  group: site-bootstrap-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refuse credential-bearing environment
        shell: bash
        run: |
          set -euo pipefail
          for name in GITHUB_TOKEN GH_TOKEN GITHUB_PAT TVC_EPHEMERAL_GITHUB_TOKEN STEGVERSE_PROVIDER_TOKEN STEGVERSE_MASTER_RECORDS_TOKEN STEGVERSE_HIL_REVIEW_TOKEN STEGVERSE_HIL_PUBLICATION_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            if [ -n "${!name:-}" ]; then
              echo "forbidden credential environment variable present: ${name}" >&2
              exit 1
            fi
          done
          echo 'SITE_BOOTSTRAP_CREDENTIAL_AUTHORITY=TV_TVC'
          echo 'SITE_BOOTSTRAP_GITHUB_TOKEN_AUTHORITY=NONE'

      - name: Fetch exact Site source anonymously
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            SOURCE_REF="refs/pull/${PR_NUMBER}/merge"
          else
            SOURCE_REF="${GITHUB_SHA}"
          fi
          git -c credential.helper= -c http.extraheader= fetch --no-tags --depth=50 origin "${SOURCE_REF}"
          git checkout --detach FETCH_HEAD
          test -z "$(git config --local --get-regexp 'extraheader|credential' || true)"

      - name: Verify preinstalled Python and repository-local schema validator
        shell: bash
        run: |
          python3 --version
          python3 - <<'PY'
          import sys
          from scripts.stegverse_jsonschema import Draft202012Validator, FormatChecker
          assert sys.version_info >= (3, 11), sys.version
          assert Draft202012Validator is not None
          assert FormatChecker is not None
          print('SITE_BOOTSTRAP_PYTHON=PASS')
          print('SITE_BOOTSTRAP_SCHEMA_VALIDATOR=REPOSITORY_LOCAL')
          print('SITE_BOOTSTRAP_PUBLIC_PYPI_REQUIRED=false')
          PY

      - name: Validate HIL pilot ledger, announcement status, and deterministic fixtures
        run: |
          python3 scripts/validate_hil_pilot_ledger.py
          python3 scripts/test_hil_pilot_validation.py
          python3 scripts/derive_hil_announcement_status.py --check
          python3 scripts/test_hil_announcement_status.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.stegverse_jsonschema import Draft202012Validator, FormatChecker
          status = json.loads(Path('data/hil-announcement-status.json').read_text(encoding='utf-8'))
          schema = json.loads(Path('data/schemas/hil-announcement-status.schema.json').read_text(encoding='utf-8'))
          errors = sorted(Draft202012Validator(schema, format_checker=FormatChecker()).iter_errors(status), key=lambda error: list(error.path))
          if errors:
              raise SystemExit('\n'.join(error.message for error in errors))
          print('HIL_ANNOUNCEMENT_STATUS_SCHEMA=PASS')
          PY

      - name: Validate Master Records persistent service evidence imports
        run: python3 scripts/check_master_records_persistent_service_evidence_import.py

      - name: Validate SV-CONTINUITY-109 Site receipt and premature-PASS rejection
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_sv_continuity_109_site_receipt.py receipts/sv-continuity-109-site-verification.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = Path('receipts/sv-continuity-109-site-verification.json')
          receipt = json.loads(source.read_text(encoding='utf-8'))
          if receipt.get('decision') != 'BLOCK':
            raise SystemExit('expected current canonical SV-CONTINUITY-109 Site receipt to remain BLOCK')
          receipt['decision'] = 'PASS'
          Path('/tmp/sv-continuity-109-premature-pass.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          PY
          if python3 scripts/check_sv_continuity_109_site_receipt.py /tmp/sv-continuity-109-premature-pass.json; then
            echo 'Premature PASS was incorrectly accepted' >&2
            exit 1
          fi
          echo 'SV_CONTINUITY_109_SITE_VALIDATION=PASS'
          echo 'SV_CONTINUITY_109_PREMATURE_PASS_REJECTION=PASS'
          echo 'SV_CONTINUITY_109_AUTHORITY_EFFECT=NONE'

      - name: Validate VA guided workflow deterministically without artifact custody
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_va_claims_guide_surface.py
          python3 scripts/test_va_guided_workflow_contract.py
          python3 scripts/validate_va_guided_visual_assets.py
          test -s data/va-claim-assistant/guide-surface-validation.json
          test -s data/va-claim-assistant/guided-workflow-contract-validation.json
          test -s data/va-claim-assistant/guided-visual-assets-validation.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = [
              Path('data/va-claim-assistant/guide-surface-validation.json'),
              Path('data/va-claim-assistant/guided-workflow-contract-validation.json'),
              Path('data/va-claim-assistant/guided-visual-assets-validation.json'),
          ]
          for path in paths:
              body = json.loads(path.read_text(encoding='utf-8'))
              if body.get('state') != 'PASS':
                  raise SystemExit(f'VA guided validation receipt is not PASS: {path}')
              if body.get('authority_effect') is not False:
                  raise SystemExit(f'VA guided receipt asserted authority: {path}')
              if body.get('activation_effect') is not False:
                  raise SystemExit(f'VA guided receipt asserted activation: {path}')
          print('VA_GUIDED_WORKFLOW_VALIDATION=PASS')
          print('VA_GUIDED_WORKFLOW_RECEIPTS=3_LOCAL_DETERMINISTIC')
          print('VA_GUIDED_WORKFLOW_ARTIFACT_CUSTODY=NONE')
          print('VA_GUIDED_WORKFLOW_AUTHORITY_EFFECT=NONE')
          print('VA_GUIDED_WORKFLOW_ACTIVATION_EFFECT=NONE')
          PY

      - name: Validate child-safety sovereign observer source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          task = json.loads(Path('data/tasks/SITE-0003-CHILD-SAFETY-PUBLIC-DEPLOYMENT.json').read_text(encoding='utf-8'))
          script = Path('scripts/check_child_safety_public_deployment.py').read_text(encoding='utf-8')
          old_workflow = Path('.github/workflows/verify-child-safety-public-deployment.yml')
          owner = task.get('owner', {})
          contract = task.get('current_observer_contract', {})
          assert owner.get('repository') == 'StegVerse-Labs/StegVerse-Healer'
          assert owner.get('machine_task') == 'SHWP-HEALER-SOVEREIGN-SCHEDULER-001'
          assert owner.get('target') == 'child-safety-public-deployment-observer'
          assert contract.get('credential_authority') == 'TV/TVC'
          assert contract.get('credential_requirement') == 'NONE'
          assert contract.get('github_token_required') is False
          assert contract.get('non_tv_tvc_secret_or_token_allowed') is False
          assert contract.get('artifact_custody_required') is False
          assert contract.get('fail_closed') is True
          assert 'STEGVERSE_CHILD_SAFETY_REPORT' in script
          assert 'github_token_required' in script
          assert 'artifact_custody_required' in script
          assert not old_workflow.exists()
          print('CHILD_SAFETY_SOVEREIGN_OBSERVER_CONTRACT=PASS')
          print('CHILD_SAFETY_GITHUB_TOKEN_REQUIRED=false')
          print('CHILD_SAFETY_ARTIFACT_CUSTODY_REQUIRED=false')
          print('CHILD_SAFETY_HOSTED_SCHEDULE=RETIRED')
          print('CHILD_SAFETY_AUTHORITY_EFFECT=NONE')
          PY

      - name: Inventory and validate workflow entry points
        run: |
          python3 scripts/write_site_workflow_inventory.py
          python3 scripts/check_site_workflow_inventory.py

      - name: Validate exclusive claims and Site orchestration
        run: |
          python3 scripts/check_session_work_claims.py
          python3 scripts/site_handoff_orchestrator.py
          python3 scripts/check_ecosystem_heartbeat_orchestration.py

      - name: Validate bounded StegClaw release awareness
        run: python3 scripts/check_stegclaw_release_awareness.py

      - name: Validate Current News Releases and exact Entity Economy Volume II artifact transport
        run: python3 scripts/check_current_news_releases.py

      - name: Validate canonical Site application directly
        run: python scripts/check_ecosystem_chat_application.py

      - name: Validate iPhone HB29 to HB30 transition projection
        run: python3 scripts/check_iphone_heartbeat_transition_projection.py

      - name: Execute ST-017 isolated validation without artifact transport
        run: python3 scripts/run_sandbox_validation.py

      - name: Validate canonical StegFin phone projection with SKAP Vault extension
        run: python3 scripts/check_stegfin_phone_projection_with_skap.py

      - name: Observe merged StegFin wallet-browser publication without credential
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          report=/tmp/stegfin-public-wallet-transport.report.json
          for attempt in 1 2 3 4 5 6; do
            echo "publication observation attempt ${attempt}/6"
            if STEGVERSE_STEGFIN_PUBLICATION_REPORT="$report" python3 scripts/check_stegfin_public_wallet_transport.py; then
              cat "$report"
              echo 'STEGFIN_PUBLICATION_OBSERVER_AUTHORITY_EFFECT=NONE'
              echo 'STEGFIN_PUBLICATION_OBSERVER_GITHUB_TOKEN_REQUIRED=false'
              exit 0
            fi
            cat "$report" || true
            sleep 20
          done
          echo 'StegFin publication did not reach exact merged state inside bounded observation window' >&2
          exit 1

      - name: Confirm validation-only authority boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/validate.yml').read_text(encoding='utf-8')
          forbidden = [
              'actions/' + 'checkout@',
              'actions/' + 'setup-python@',
              'actions/' + 'upload-artifact@',
              'persist-' + 'credentials',
              'git ' + 'push',
              'STEGVERSE_PROVIDER_TOKEN' + ':',
              'STEGVERSE_MASTER_RECORDS_TOKEN' + ':',
              'schedule' + ':',
              'repository:' + ' StegVerse-org/LLM-adapter',
              'pip install -e ' + "'./adapter-source[service]'",
              'pip install jsonschema',
              'python3 -m pip install jsonschema',
          ]
          assert 'permissions: {}' in workflow
          assert 'Refuse credential-bearing environment' in workflow
          assert 'SITE_BOOTSTRAP_SCHEMA_VALIDATOR=REPOSITORY_LOCAL' in workflow
          assert 'SITE_BOOTSTRAP_PUBLIC_PYPI_REQUIRED=false' in workflow
          assert 'from scripts.stegverse_jsonschema import Draft202012Validator, FormatChecker' in workflow
          assert 'python scripts/check_ecosystem_chat_application.py' in workflow
          assert 'python3 scripts/check_master_records_persistent_service_evidence_import.py' in workflow
          assert 'python3 scripts/check_sv_continuity_109_site_receipt.py receipts/sv-continuity-109-site-verification.json' in workflow
          assert 'SV_CONTINUITY_109_PREMATURE_PASS_REJECTION=PASS' in workflow
          assert 'python3 scripts/validate_va_claims_guide_surface.py' in workflow
          assert 'python3 scripts/test_va_guided_workflow_contract.py' in workflow
          assert 'python3 scripts/validate_va_guided_visual_assets.py' in workflow
          assert 'VA_GUIDED_WORKFLOW_ARTIFACT_CUSTODY=NONE' in workflow
          assert 'CHILD_SAFETY_SOVEREIGN_OBSERVER_CONTRACT=PASS' in workflow
          assert 'python3 scripts/check_current_news_releases.py' in workflow
          assert 'python3 scripts/check_iphone_heartbeat_transition_projection.py' in workflow
          assert 'python3 scripts/check_stegfin_phone_projection_with_skap.py' in workflow
          assert 'python3 scripts/check_stegfin_public_wallet_transport.py' in workflow
          assert all(marker not in workflow for marker in forbidden), forbidden
          print('SITE_BOOTSTRAP_VALIDATION_ONLY=PASS')
          print('SITE_BOOTSTRAP_RUNTIME_EXECUTION_AUTHORITY=NONE')
          print('SITE_BOOTSTRAP_REPOSITORY_WRITEBACK=NONE')
          print('SITE_BOOTSTRAP_ARTIFACT_TRANSPORT=NONE')
          PY

# Portable-node gateway launch/inference proof is intentionally not performed here.
# That runtime capability is already COMPLETE_RELEASED under the canonical
# StegVerse resident-worker/local-runtime ownership and must not be recreated
# through a GitHub-hosted validation job or a private GitHub dependency fetch.
