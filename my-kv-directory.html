<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Browse a KnowledgeVault continuity directory through a read-only canonical KV bridge.">
<title>StegVerse — My KV Directory</title>
<link rel="stylesheet" href="sv-shared.css">
<style>
.dir-wrap{max-width:900px;margin:0 auto}.dir-head,.entry-card,.empty-card{background:var(--surface);border:2px solid var(--border);border-radius:18px;padding:16px;margin:0 0 16px}.crumbs{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:.9rem}.path{font:12px/1.5 var(--mono);word-break:break-all;color:var(--muted)}.status{font:12px/1.5 var(--mono);padding:10px 0}.status.error{color:#ffb4ab}.entry-list{display:grid;gap:12px}.entry-card{margin:0;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.entry-card h2{font-size:1rem;margin:0 0 5px}.meta{color:var(--muted);font-size:.86rem}.entry-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.entry-card button,.entry-card a{white-space:nowrap}.kind{font:10px var(--mono);border:1px solid var(--border2);border-radius:999px;padding:3px 7px}.back{display:inline-block;margin:0 0 16px}@media(max-width:640px){.entry-card{grid-template-columns:1fr}.entry-actions{justify-content:stretch}.entry-card button,.entry-card a{width:100%;box-sizing:border-box;text-align:center}}
</style>
</head>
<body>
<nav class="sv-nav"><a class="sv-nav-brand" href="index.html">StegVerse</a><a class="active" href="my-kv.html">My KV</a><a href="organizational-kv.html">Organizational KV</a><a href="stegos-node/">My Node</a></nav>
<div class="sv-wrap dir-wrap">
<a class="back" href="my-kv.html">← Back to My KV</a>
<section class="dir-head">
  <div class="crumbs"><span>KnowledgeVault</span><span>›</span><span id="dir-label">Directory</span></div>
  <h1 id="dir-title">Loading directory…</h1>
  <p id="dir-description"></p>
  <div class="path" id="dir-path"></div>
  <div class="card-actions"><button id="dir-connect-source" class="sv-btn sv-btn-primary" type="button">Connect / refresh direct source</button><button id="dir-resident-request" class="sv-btn sv-btn-secondary" type="button" hidden>Request resident connection</button></div>
  <p class="status" id="dir-status" role="status" aria-live="polite"></p>
</section>
<div id="entry-list" class="entry-list"></div>
</div>
<script src="assets/stegverse-node-continuity.js"></script>
<script src="assets/kv-ui/resident-rendezvous-client.js"></script>
<script src="assets/generated/site-browser-intr-connectors.js"></script>
<script src="assets/hb-intr-carrier.js"></script>
<script src="stegos-node/device-kv-intr-sync.js?v=20260902-device-local-r5"></script>
<script src="assets/my-kv-directory.js"></script>
<script src="assets/my-kv-device-kv-query-bridge.js?v=20260902-device-local-r4"></script>
<script src="assets/my-kv-portable-direct-source-bridge.js"></script>
<script>
(function(){
"use strict";
var api=window.StegVerseMyKVDirectory;
var bridge=null;
var sourceBridge=window.StegVerseKVDirectSourceBridge||null;
var QUERY_BRIDGE_SRC="assets/my-kv-device-kv-query-bridge.js?v=20260902-device-local-r4";

function queryBridgeReady(){
  return !!(window.StegVerseKVDirectoryBridge&&typeof window.StegVerseKVDirectoryBridge.listDirectory==="function");
}
function ensureQueryBridge(){
  if(queryBridgeReady()){
    bridge=window.StegVerseKVDirectoryBridge;
    return Promise.resolve(bridge);
  }
  return new Promise(function(resolve,reject){
    var retry=document.createElement("script");
    retry.src=QUERY_BRIDGE_SRC+"&retry="+Date.now();
    retry.async=false;
    retry.onload=function(){
      retry.remove();
      if(!queryBridgeReady()){
        reject(new Error("FAIL_CLOSED: canonical DEVICE_KV query bridge loaded but did not initialize"));
        return;
      }
      bridge=window.StegVerseKVDirectoryBridge;
      resolve(bridge);
    };
    retry.onerror=function(){
      retry.remove();
      reject(new Error("FAIL_CLOSED: canonical DEVICE_KV query bridge asset unavailable"));
    };
    document.head.appendChild(retry);
  });
}
var params=new URLSearchParams(window.location.search);
var id=params.get("dir")||"";
var connectButton=document.getElementById("dir-connect-source");
var residentButton=document.getElementById("dir-resident-request");
var residentClient=window.StegVerseResidentRendezvous||null;
if(sourceBridge&&sourceBridge.bridge_kind==="PORTABLE_OWNER_CONTROLLED_FILE_STAGING") connectButton.textContent="Import owner-controlled files";

function configureResidentAction(){
  if(!residentButton||!residentClient||!window.StegVerseNodeContinuity||typeof window.StegVerseNodeContinuity.status!=="function"){
    if(residentButton)residentButton.hidden=true; return;
  }
  window.StegVerseNodeContinuity.status().then(function(node){
    residentButton.hidden=!(node&&node.registered===true); residentButton.disabled=false;
  }).catch(function(){residentButton.hidden=true;});
}
if(residentButton){
  residentButton.addEventListener("click",function(){
    if(!residentClient){status.textContent="Resident rendezvous client unavailable.";status.className="status error";return;}
    residentButton.disabled=true; status.textContent="Discovering an active sovereign resident for this registered Node…"; status.className="status";
    residentClient.submitDiscovered({gatewayBaseUrl:window.location.origin}).then(function(result){
      status.textContent="Resident request "+result.request_id+" is pending for "+result.target_node_ref+". WorkerCoordinator still controls execution admission.";
      status.className="status"; residentButton.disabled=false;
    }).catch(function(error){
      if(error&&error.code==="VERIFY_EXTERNALLY"){
        status.textContent="Resident request outcome is ambiguous. Verify externally before any retry."; status.className="status error"; residentButton.disabled=true; return;
      }
      if(error&&error.code==="RESIDENT_RENDEZVOUS_UNAVAILABLE") status.textContent="No sovereign resident is currently advertising availability.";
      else if(error&&error.code==="RESIDENT_RENDEZVOUS_AMBIGUOUS") status.textContent="Multiple sovereign residents are advertising; no request was sent.";
      else if(error&&error.code==="REGISTER_DEVICE_REQUIRED"){status.textContent="A registered StegVerse Node is required.";residentButton.hidden=true;}
      else status.textContent=error&&error.message?error.message:"Resident rendezvous request failed closed.";
      status.className="status error"; residentButton.disabled=false;
    });
  });
}
configureResidentAction();
var title=document.getElementById("dir-title"), label=document.getElementById("dir-label"), desc=document.getElementById("dir-description"), path=document.getElementById("dir-path"), status=document.getElementById("dir-status"), list=document.getElementById("entry-list");

function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function erlRefForEntry(domain,entry){
  if(domain.id!=="erl")return null;
  var raw=String(entry.canonical_path||entry.path||"").replace(/^\/KnowledgeVault\//,"").replace(/^\/+/,"");
  if(raw.indexOf("02_Research/ERL/")===0)return raw;
  var name=String(entry.name||entry.display_name||"").replace(/^\/+/,"");
  if(!name||name.indexOf("/")!==-1)return null;
  return domain.path+"/"+name;
}
function renderEntry(domain,entry){
  var card=el("article","entry-card"), left=el("div"), h=el("h2","",entry.name||entry.display_name||"Unnamed entry"), meta=el("div","meta");
  var kind=entry.kind||entry.type||"file";
  meta.appendChild(el("span","kind",kind));
  if(entry.modified_at){meta.append(" · "+entry.modified_at);}
  if(entry.size_bytes!==undefined&&entry.size_bytes!==null){meta.append(" · "+entry.size_bytes+" bytes");}
  left.append(h,meta); card.appendChild(left);
  var actions=el("div","entry-actions");
  var b=el("button","sv-btn sv-btn-secondary",kind==="directory"?"Open folder":"Open");
  b.type="button";
  b.addEventListener("click",function(){
    api.openEntry(domain.id,entry,bridge).catch(function(e){status.textContent=e.message;status.className="status error";});
  });
  actions.appendChild(b);
  var erlRef=erlRefForEntry(domain,entry);
  if(erlRef&&kind!=="directory"&&kind!=="folder"){
    var prep=el("a","sv-btn sv-btn-primary","Prepare post");
    prep.href="stegsocials-prepare.html?erl_ref="+encodeURIComponent(erlRef)+"&platform=LINKEDIN";
    prep.setAttribute("aria-label","Prepare a StegSocials post using "+(entry.name||"this ERL artifact"));
    actions.appendChild(prep);
  }
  card.appendChild(actions); list.appendChild(card);
}
function renderEmpty(domain,result){
  var empty=el("section","empty-card");
  empty.appendChild(el("h2","",domain.id==="erl"?"No ERL files in the current resident KV":"No files available to display"));
  if(domain.id==="erl"){
    empty.appendChild(el("p","","This read checked the current resident DEVICE_KV projection only. A separate Google Drive, iCloud, or other cloud KV is not included unless that KV has been connected/materialized into the active set."));
    empty.appendChild(el("p","","To continue without changing cloud-KV state, use “Import owner-controlled files” and select the ERL artifact from iPhone Files. The selected bytes are staged locally and will appear here only after canonical KV admission and readback."));
  }else{
    empty.appendChild(el("p","","This directory is currently empty in the current resident DEVICE_KV projection."));
  }
  list.appendChild(empty);
}
try{
  var domain=api.getDomain(id);
  title.textContent=domain.label;label.textContent=domain.label;desc.textContent=domain.description;path.textContent="/KnowledgeVault/"+domain.path;
  connectButton.addEventListener("click",function(){
    var portable=sourceBridge&&sourceBridge.bridge_kind==="PORTABLE_OWNER_CONTROLLED_FILE_STAGING";
    connectButton.disabled=true;
    status.textContent=portable
      ?"Choose owner-controlled files from this device. No SKAP credential is required."
      :"Requesting owner-authorized direct source through SKAP Vault…";
    status.className="status";
    api.connectSource(domain.id,sourceBridge).then(function(result){
      status.textContent=result.message||"Direct source connection confirmed.";
      status.className="status";
      if(result.state==="QUEUED_FOR_KV_ADMISSION"){
        status.textContent+=(result.materialization_id?" Materialization "+result.materialization_id+".":"")+" It will appear here only after canonical KV admission and readback.";
        return null;
      }
      status.textContent+=" Refreshing directory…";
      return ensureQueryBridge().then(function(activeBridge){
        return api.loadDirectory(domain.id,activeBridge);
      });
    }).then(function(result){
      connectButton.disabled=false;
      if(!result)return;
      status.textContent=result.message;status.className="status"+(result.state==="BRIDGE_UNAVAILABLE"?" error":"");
    }).catch(function(e){
      connectButton.disabled=false;
      status.textContent=e.message;status.className="status error";
    });
  });
  ensureQueryBridge().then(function(activeBridge){
    return api.loadDirectory(domain.id,activeBridge);
  }).then(function(result){
    status.textContent=result.message;status.className="status";
    if(!result.entries.length){renderEmpty(domain,result);return;}
    result.entries.forEach(function(entry){renderEntry(domain,entry);});
  }).catch(function(e){
    status.textContent=e.message;status.className="status error";
    var empty=el("section","empty-card");
    empty.appendChild(el("h2","","KnowledgeVault directory readback unavailable"));
    empty.appendChild(el("p","",e.message));
    list.appendChild(empty);
  });
}catch(e){
  title.textContent="Unknown KnowledgeVault directory";status.textContent=e.message;status.className="status error";path.textContent="";
}
}());
</script>
</body>
</html>
