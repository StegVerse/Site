<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StegVerse Organization Allocator</title>
<style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}body{margin:0;background:#0b0d10;color:#f3f5f7}main{max-width:760px;margin:auto;padding:24px 18px 64px}.card{border:1px solid #2b3138;border-radius:14px;padding:16px;margin:16px 0;background:#12161b}button{font:inherit;border:0;border-radius:10px;padding:13px 16px;font-weight:700}button:disabled{opacity:.55}.ok{color:#9fe6aa}.bad{color:#ffb4ab}.muted{color:#aeb7c2}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
</head><body><main>
<h1>Canonical Organization Allocator</h1>
<p class="muted">Runs the canonical StegVerse-Labs organization allocator on this established iPhone. Site and this page do not grant claims.</p>
<section class="card"><h2>Established node</h2><p id="node-state">Checking continuity…</p><code id="node-id"></code></section>
<section class="card"><h2>Allocator</h2><button id="run" disabled>Run canonical allocation</button><p id="state" class="muted">Waiting for established continuity.</p><pre id="summary"></pre></section>
<section class="card"><h2>Evidence</h2><button id="export" disabled>Export allocator evidence</button></section>
<script src="./org-allocator-portable.js?v=g5-cachefix-20260909-1"></script>
<script>
(function(){"use strict";
var NODE_DB="stegos-web-bootstrap-v1",META="meta",RECEIPTS="receipts",NODE="node",DEVICE="device-continuity-root";
var ALLOC_DB="stegos-org-allocator-v1",ALLOC_STORE="state",ALLOC_KEY="canonical-portable-state";
var ORG_ALLOCATOR_RELEASE="g5-cachefix-20260909-1";
var PACKAGE="./org-allocator-current-iphone-package.json?v="+ORG_ALLOCATOR_RELEASE;
var nodeState=document.getElementById("node-state"),nodeIdEl=document.getElementById("node-id"),run=document.getElementById("run"),stateEl=document.getElementById("state"),summary=document.getElementById("summary"),exportBtn=document.getElementById("export");
var continuity=null,evidence=null,pkg=null;

function openNodeDb(){return new Promise(function(ok,no){var q=indexedDB.open(NODE_DB);q.onsuccess=function(){ok(q.result)};q.onerror=function(){no(q.error||Error("node continuity database unavailable"))};q.onupgradeneeded=function(){try{q.transaction.abort()}catch(e){}no(Error("established node database not visible"))}})}
function readMeta(db,key){return new Promise(function(ok,no){var q=db.transaction(META,"readonly").objectStore(META).get(key);q.onsuccess=function(){ok(q.result?q.result.value:null)};q.onerror=function(){no(q.error)}})}
function readRows(db){return new Promise(function(ok,no){var q=db.transaction(RECEIPTS,"readonly").objectStore(RECEIPTS).getAll();q.onsuccess=function(){var rows=q.result||[];rows.sort(function(a,b){return a.sequence-b.sequence});ok(rows)};q.onerror=function(){no(q.error)}})}
function sha(v){return self.StegVersePortableOrgClaimAllocator.sha256Hex(v)}
function replay(rows){var prev=null,p=Promise.resolve();rows.forEach(function(row,i){p=p.then(function(){if(row.schema!=="stegos.web_bootstrap_journal_entry.v1"||row.sequence!==i+1||row.previous_entry_sha256!==prev)throw Error("node journal chain mismatch");return sha(row.receipt).then(function(h){if(h!==row.receipt_sha256)throw Error("node journal receipt hash mismatch");var copy={};Object.keys(row).forEach(function(k){if(k!=="entry_sha256")copy[k]=row[k]});return sha(copy)}).then(function(h){if(h!==row.entry_sha256)throw Error("node journal entry hash mismatch");prev=row.entry_sha256})})});return p.then(function(){return{state:"PASS",entries:rows.length,tail_sha256:prev}})}
function validateBinding(node,device,rows){if(!node||node.schema!=="stegos.web_node.v1"||node.host_origin!==location.origin||node.credential_authority!=="TV/TVC")throw Error("established node invalid");if(!device||device.schema!=="stegos.web_device_continuity_root.v1"||device.origin!==location.origin)throw Error("device continuity invalid");if(!rows.some(function(x){var r=x.receipt||{};return r.schema==="stegos.web_device_node_binding_receipt.v1"&&r.node_id===node.node_id&&r.device_continuity_id===device.device_continuity_id}))throw Error("node/device binding receipt missing")}
function loadContinuity(){return openNodeDb().then(function(db){return Promise.all([readMeta(db,NODE),readMeta(db,DEVICE),readRows(db)]).then(function(v){validateBinding(v[0],v[1],v[2]);return replay(v[2]).then(function(rep){continuity={db:db,node:v[0],device:v[1],rows:v[2],replay:rep};nodeState.textContent="Continuity verified";nodeState.className="ok";nodeIdEl.textContent=v[0].node_id;run.disabled=false})})}).catch(function(e){nodeState.textContent="FAIL_CLOSED: "+e.message;nodeState.className="bad";throw e})}
function openAllocDb(){return new Promise(function(ok,no){var q=indexedDB.open(ALLOC_DB,1);q.onupgradeneeded=function(){var db=q.result;if(!db.objectStoreNames.contains(ALLOC_STORE))db.createObjectStore(ALLOC_STORE,{keyPath:"key"})};q.onsuccess=function(){ok(q.result)};q.onerror=function(){no(q.error)}})}
function allocStore(){return{
 read:function(){return openAllocDb().then(function(db){return new Promise(function(ok,no){var q=db.transaction(ALLOC_STORE,"readonly").objectStore(ALLOC_STORE).get(ALLOC_KEY);q.onsuccess=function(){db.close();ok(q.result?q.result.value:null)};q.onerror=function(){db.close();no(q.error)}})})},
 atomicCompareAndSwap:function(expected,next){return openAllocDb().then(function(db){return new Promise(function(ok,no){var tx=db.transaction(ALLOC_STORE,"readwrite"),store=tx.objectStore(ALLOC_STORE),q=store.get(ALLOC_KEY),committed=false;q.onsuccess=function(){var current=q.result?q.result.value:null;var matches;if(current===null){matches=self.StegVersePortableOrgClaimAllocator.canonicalize(expected)===self.StegVersePortableOrgClaimAllocator.canonicalize(self.StegVersePortableOrgClaimAllocator.initialState(pkg))}else{matches=self.StegVersePortableOrgClaimAllocator.canonicalize(current)===self.StegVersePortableOrgClaimAllocator.canonicalize(expected)}if(matches){store.put({key:ALLOC_KEY,value:next});committed=true}};q.onerror=function(){no(q.error)};tx.oncomplete=function(){db.close();ok(committed)};tx.onerror=function(){var e=tx.error;db.close();no(e)};tx.onabort=function(){var e=tx.error;db.close();no(e)}})})}
}}
function appendNodeReceipt(body){var rows=continuity.rows,entry={schema:"stegos.web_bootstrap_journal_entry.v1",sequence:rows.length+1,previous_entry_sha256:rows.length?rows[rows.length-1].entry_sha256:null,receipt:body};return sha(body).then(function(h){entry.receipt_sha256=h;return sha(entry)}).then(function(h){entry.entry_sha256=h;return new Promise(function(ok,no){var tx=continuity.db.transaction(RECEIPTS,"readwrite");tx.objectStore(RECEIPTS).add(entry);tx.oncomplete=function(){rows.push(entry);ok(entry)};tx.onerror=function(){no(tx.error)};tx.onabort=function(){no(tx.error)}})})}
function loadPackage(){return fetch(PACKAGE,{cache:"no-store",credentials:"omit"}).then(function(r){if(!r.ok)throw Error("allocator package unavailable");return r.json()}).then(function(p){self.StegVersePortableOrgClaimAllocator.validatePackage(p);pkg=p;return p})}
function execute(){run.disabled=true;stateEl.textContent="Executing canonical allocator…";Promise.resolve(pkg?pkg:loadPackage()).then(function(p){return self.StegVersePortableOrgClaimAllocator.allocate(p,allocStore(),{})}).then(function(result){var obs=result.claim_observation;var sourceBinding=JSON.parse(JSON.stringify((pkg&&pkg.source_binding)||{}));var receipt={schema:"stegos.org_allocator_same_device_execution_receipt/v1",node_id:continuity.node.node_id,device_continuity_id:continuity.device.device_continuity_id,execution_surface:"CURRENT_USER_IPHONE",allocator_release:ORG_ALLOCATOR_RELEASE,portable_package_source_binding:sourceBinding,canonical_allocator_receipt:result.receipt,claim_observation:obs,portable_claim_registry_generation:result.state.claims_state.generation,selected_task_id:result.receipt.selected,allocator_remains_claim_authority:true,site_grants_claim_authority:false,heartbeat_grants_claim_authority:false,browser_shell_grants_claim_authority:false,credential_authority:"TV/TVC",github_token_runtime_authority:"NONE",requires_other_machine:false,authority_effect:"NONE_EVIDENCE_OF_CANONICAL_ALLOCATOR_TRANSITION",executed_at:new Date().toISOString()};return appendNodeReceipt(receipt).then(function(entry){return replay(continuity.rows).then(function(rep){evidence={schema:"stegverse.device-org-allocator-execution-evidence/v1",state:"CANONICAL_ALLOCATION_EXECUTED",node_id:continuity.node.node_id,device_continuity_id:continuity.device.device_continuity_id,node:continuity.node,device_continuity:continuity.device,allocator_release:ORG_ALLOCATOR_RELEASE,portable_package_source_binding:sourceBinding,allocator_receipt:result.receipt,claim_observation:obs,node_journal_entry:entry,node_journal_replay:rep,continued_receipts:continuity.rows.slice(),selected_task_id:result.receipt.selected,claim_registry_generation:result.state.claims_state.generation,task_0008_granted:!!(obs&&obs.task_id==="TASK-2026-0008"),same_device:true,requires_other_machine:false,credential_authority:"TV/TVC",authority_effect:"NONE_EVIDENCE_ONLY"};stateEl.textContent="Canonical allocation executed: "+(result.receipt.selected||"no task selected");stateEl.className="ok";summary.textContent=JSON.stringify({selected_task_id:evidence.selected_task_id,claim_registry_generation:evidence.claim_registry_generation,task_0008_granted:evidence.task_0008_granted,fencing_tokens:obs?obs.fencing_tokens:[],allocator_release:ORG_ALLOCATOR_RELEASE,task_0010_source_binding:sourceBinding.task_0010_git_blob_sha||null,node_journal_tail:rep.tail_sha256},null,2);exportBtn.disabled=false;run.disabled=false})})}).catch(function(e){stateEl.textContent="FAIL_CLOSED: "+e.message;stateEl.className="bad";run.disabled=false})}
function exportEvidence(){if(!evidence)return;var b=new Blob([JSON.stringify(evidence,null,2)+"\n"],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="stegverse-org-allocator-"+(evidence.selected_task_id||"none")+"-G"+evidence.claim_registry_generation+".json";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u)}
run.addEventListener("click",execute);exportBtn.addEventListener("click",exportEvidence);
loadPackage().then(loadContinuity).catch(function(){});
}());
</script>
</main></body></html>
